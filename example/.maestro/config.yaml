# Maestro workspace config: run the top-level flows in order; `subflows/` are only used via runFlow.
flows:
  - "*.yaml"
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - 01-screens-render
    - 02-travel-arrive
    - 03-drops-collect
    - 04-labels-holo
    - 05-native-m1
    - 06-native-m2a
    - 07-native-m2c
    - 08-native-m3a
    - 09-native-labels
    - 10-native-m4
    - 11-markers
    - 12-camera-limits
    - 13-sheet-idle-inset
