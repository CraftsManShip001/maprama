# Native engine (M3a + M3b): game systems with 3D models in the custom layer. A walker (the example glTF robot)
# follows the simulated location source (character:position readout), the `route` request places two drops on
# the way, the player (procedural body) travels to the near preset (collects the first drop, enters the geofence)
# and then to the far preset (collects the second drop, leaves the geofence). M3b: close-ups of three statues
# behind / at the corner of / beside a tall block (depth-tested occlusion by the building), the walking robot
# and a 50-character crowd. The flow checks the readouts and the event log lines written by the same handlers
# (travel:arrive, drop onCollect, geofence onEnter / onExit), like 03-drops-collect.yaml, and that no model
# failed to load (no `error model_load_failed` line). Taps over the animated map settle for at most 500 ms.
appId: dev.maprama.catalog
name: Native engine M3a/M3b characters, 3D models, travel, drops and geofences
tags:
  - native
---
- runFlow:
    file: subflows/open-screen.yaml
    env:
      SCREEN: native-game
- extendedWaitUntil:
    visible:
      id: "native-game-walker"
      text: "walker: [0-9].*"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "native-game-route"
      text: "route: [0-9]+ m .*"
    timeout: 20000
- assertVisible:
    id: "native-game-zone"
    text: "near-zone: outside \\(enter 0, exit 0\\)"
- takeScreenshot: native-m3a-start
- tapOn:
    id: "native-game-follow-me"
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "native-game-go-near"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "native-game-status"
      text: "status: arrived at near"
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: "native-game-collected"
      text: "collected: 1 \\(coin-near\\)"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "native-game-zone"
      text: "near-zone: inside \\(enter 1, exit 0\\)"
    timeout: 10000
- takeScreenshot: native-m3a-near
- tapOn:
    id: "native-game-go-far"
    waitToSettleTimeoutMs: 500
# The route line and the destination pin are drawn while the player travels.
- takeScreenshot: native-m3a-travelling
- extendedWaitUntil:
    visible:
      id: "native-game-status"
      text: "status: arrived at far"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "native-game-collected"
      text: "collected: 2 \\(coin-near, coin-far\\)"
    timeout: 10000
# The road to the far preset can skirt the zone again: at least one exit, and outside at the end.
- assertVisible:
    id: "native-game-zone"
    text: "near-zone: outside \\(enter [1-9], exit [1-9]\\)"
- takeScreenshot: native-m3a-far
# Overview: both characters, the geofence fill + ring and the walker on its demo loop.
- tapOn:
    id: "native-game-overview"
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: native-m3a-overview
# M3b: the 3D model close-ups (the buttons sit below the travel buttons; swipe on the panel, not the map).
- repeat:
    times: 4
    while:
      notVisible:
        id: "native-game-crowd-off"
    commands:
      - swipe:
          from:
            id: "panel"
          direction: UP
- tapOn:
    id: "native-game-occlusion"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "native-game-models"
      text: ".*occlusion: on"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
# Statues south of the tall block, seen from the north: behind it (hidden), at its corner (half hidden), beside it.
- takeScreenshot: native-m3b-occlusion
- tapOn:
    id: "native-game-closeup-walker"
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 3000
# The glTF robot walking (walk clip at its cadence), the camera following it.
- takeScreenshot: native-m3b-robot-walking
- tapOn:
    id: "native-game-showcase"
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 3000
# One of each drop item: coin, gem, CD, LP, note, glTF model (rare / legendary beams and rings).
- takeScreenshot: native-m3b-drops
- tapOn:
    id: "native-game-crowd-50"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "native-game-models"
      text: "models: 5[0-9] characters · crowd: 50.*"
    timeout: 10000
# The crowd buttons frame START (the crowd walks within ≈110 m of it).
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: native-m3b-crowd-50
- tapOn:
    id: "native-game-crowd-off"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: "native-game-models"
      text: ".*crowd: 0.*"
    timeout: 10000
# The event log sits below the fold of the control panel; swipe on the panel, not the map.
- repeat:
    times: 6
    while:
      notVisible:
        text: ".*exit near-zone \\(me\\).*"
    commands:
      - swipe:
          from:
            id: "panel"
          direction: UP
- assertVisible:
    text: ".*exit near-zone \\(me\\).*"
- assertVisible:
    text: ".*collected coin-far from m3a-drops \\(me\\).*"
- assertVisible:
    text: ".*travel:arrive at far.*"
- assertNotVisible:
    text: "engine error.*"
- assertNotVisible:
    text: ".*error [a-z_]+: .*"
- assertNotVisible:
    text: ".*model_load_failed.*"
- takeScreenshot: native-m3a-log
