name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      # packages/engine-native/scripts/build-core.sh compiles the C++ core (and its
      # ASan/UBSan conformance tests) with clang++, falling back to c++.
      - name: C++ toolchain
        run: |
          if ! command -v clang++ >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang
          fi
          clang++ --version
          # AddressSanitizer fails on kernels with high mmap ASLR entropy.
          sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          CI: '1'

      - name: Docs build
        run: npm run docs:build
